[package]
name = "hongguo-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Shared domain logic for the Rust ports of the hongguo modules"

[lib]
crate-type = ["rlib"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
regex = "1"
unicode-normalization = "0.1"
hongguo-js = { path = "../hongguo-js" }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
